# Bootstrap credentials come from the host environment; every service resolves
# its real secrets from Infisical at startup via scripts/with-secrets.sh.
x-infisical-env: &infisical-env
  INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:?set INFISICAL_DOMAIN on the host}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set INFISICAL_PROJECT_ID on the host}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?set INFISICAL_CLIENT_ID on the host}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?set INFISICAL_CLIENT_SECRET on the host}
  INFISICAL_ENV: ${INFISICAL_ENV:-prod}

services:
  # Local development database. Profile-gated, so it never starts in production:
  #   docker compose --profile local up db -d
  db:
    image: postgres:18-alpine
    profiles: ["local"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: openar
      POSTGRES_PASSWORD: openar
      POSTGRES_DB: openar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *infisical-env
      PORT: 3000
    networks: [dokploy-network, default]

  # Applies migrations and runs the ETL once a day. Replaces the GitHub Actions
  # schedule.
  worker:
    build: .
    restart: unless-stopped
    environment:
      <<: *infisical-env
      ETL_AT: ${ETL_AT:-00:00}          # HH:MM UTC
      ETL_MODE: ${ETL_MODE:---current}
    entrypoint: ["./scripts/etl-worker.sh"]
    networks: [dokploy-network, default]

  # ── One-shot jobs ───────────────────────────────────────────────────────────
  # `profiles` keeps these out of `docker compose up`; run them explicitly:
  #
  #   docker compose run --rm migrate
  #   docker compose run --rm etl                    # defaults to --current
  #   docker compose run --rm etl --leg XVII
  #   docker compose run --rm etl --all --source peticoes
  #   docker compose run --rm etl --photos
  #
  # They share the api image, so they run the exact build that is deployed.

  migrate:
    build: .
    profiles: ["tools"]
    restart: "no"
    environment: *infisical-env
    entrypoint: ["./scripts/with-secrets.sh", "node", "dist/db/migrate.js"]
    networks: [dokploy-network, default]

  etl:
    build: .
    profiles: ["tools"]
    restart: "no"
    environment: *infisical-env
    entrypoint: ["./scripts/with-secrets.sh", "node", "dist/etl/load.js"]
    command: ["--current"]
    networks: [dokploy-network, default]

# The managed database runs as a separate Dokploy service on `dokploy-network`,
# so every service that talks to it has to join that network explicitly — the
# compose default network cannot resolve the database hostname. Dokploy attaches
# `api` for us (it is the Traefik-routed service) but nothing else, which left
# the worker, and both one-shot jobs, unable to reach the database at all.
#
# Locally the network does not exist; create it once before using these services:
#   docker network create dokploy-network
networks:
  dokploy-network:
    external: true
  default:

volumes:
  db-data:
