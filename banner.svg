<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <!-- Background -->
  <rect width="1280" height="480" fill="#0F3D2A"/>

  <!-- Ghost mark — large decorative element, right bleed -->
  <g opacity="0.07" transform="translate(820, 40)">
    <circle cx="112" cy="200" r="64" fill="#F4F1EA"/>
    <circle cx="256" cy="64"  r="64" fill="#F4F1EA"/>
    <circle cx="400" cy="200" r="64" fill="#F4F1EA"/>
    <circle cx="544" cy="336" r="64" fill="#F4F1EA"/>
    <circle cx="688" cy="200" r="64" fill="#F4F1EA"/>
  </g>

  <!-- Mark — primária (cal on atlântico) -->
  <g transform="translate(96, 176) scale(0.96)">
    <circle cx="14" cy="50" r="8" fill="#F4F1EA"/>
    <circle cx="32" cy="32" r="8" fill="#F4F1EA"/>
    <circle cx="50" cy="50" r="8" fill="#F4F1EA"/>
    <circle cx="68" cy="68" r="8" fill="#F4F1EA"/>
    <circle cx="86" cy="50" r="8" fill="#F4F1EA"/>
  </g>

  <!-- Wordmark -->
  <text
    x="222" y="260"
    font-family="'DM Sans', system-ui, sans-serif"
    font-weight="700"
    font-size="112"
    letter-spacing="-4.5"
    fill="#F4F1EA"
  >OpenAR</text>

  <!-- Hairline -->
  <rect x="222" y="286" width="560" height="1" fill="#7FB69A" opacity="0.4"/>

  <!-- Tagline -->
  <text
    x="222" y="322"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    font-weight="400"
    font-size="18"
    letter-spacing="2"
    fill="#7FB69A"
  >OPEN DATA API · ASSEMBLEIA DA REPÚBLICA</text>
</svg>
