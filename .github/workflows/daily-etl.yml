name: Daily ETL

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: "ETL mode"
        required: false
        default: "--current"
        type: choice
        options:
          - "--current"
          - "--all"
          - "--force-all"
          - "--leg I"
          - "--leg II"
          - "--leg III"
          - "--leg IV"
          - "--leg V"
          - "--leg VI"
          - "--leg VII"
          - "--leg VIII"
          - "--leg IX"
          - "--leg X"
          - "--leg XI"
          - "--leg XII"
          - "--leg XIII"
          - "--leg XIV"
          - "--leg XV"
          - "--leg XVI"
          - "--leg XVII"
          - "--photos"
      source:
        description: "Limit to one source type (optional)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "informacao"
          - "iniciativas"
          - "atividade"
          - "peticoes"
          - "bio"

jobs:
  etl:
    runs-on: self-hosted
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - name: Verify Infisical CLI is available
        run: infisical --version

      - name: Run migrations
        run: pnpm run db:migrate:prod

      - name: Run ETL
        run: |
          ARGS="$ETL_MODE"
          if [ -n "$ETL_SOURCE" ]; then ARGS="$ARGS --source $ETL_SOURCE"; fi
          ./scripts/with-secrets.sh node dist/etl/load.js $ARGS
        env:
          ETL_MODE: ${{ github.event.inputs.mode || '--current' }}
          ETL_SOURCE: ${{ github.event.inputs.source || '' }}
